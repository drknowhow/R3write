name: Update sponsors in README

# Runs once a day (and on demand) to refresh the avatar grid between the
# `<!-- sponsors -->` markers in README.md with the current GitHub Sponsors
# list. The placeholder text stays put while there are zero sponsors thanks
# to the `fallback` field below.
#
# REQUIRES one secret on this repo:
#   PERSONAL_ACCESS_TOKEN — a fine-grained or classic PAT with the
#   `read:user` and `read:org` scopes, owned by drknowhow. The default
#   GITHUB_TOKEN can't query the Sponsors API.
#
#   Create at: https://github.com/settings/tokens
#   Add at:    https://github.com/drknowhow/R3write/settings/secrets/actions

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily
  workflow_dispatch:      # manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate sponsors list
        uses: JamesIves/github-sponsors-readme-action@v1
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          file: README.md
          marker: sponsors
          minimum: 0
          fallback: "*Become the first listed sponsor — your name (and avatar, if you'd like) goes here.*"
          template: '<a href="https://github.com/{{ login }}"><img src="https://github.com/{{ login }}.png" width="60px" alt="{{ login }}" /></a>'

      - name: Commit and push if README changed
        run: |
          if [ -n "$(git status --porcelain README.md)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore(sponsors): refresh sponsor list"
            git push
          else
            echo "No sponsor changes; README untouched."
          fi
