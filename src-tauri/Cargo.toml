[package]
name = "r3write"
version = "1.4.2"
description = "Inline AI text editor for Windows."
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", default-features = false, features = ["windows-native"] }
symspell = "0.5"
unicode-segmentation = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  # Autocorrect: LL keyboard hook reads virtual keys, and tagged injection needs
  # raw SendInput (enigo cannot set dwExtraInfo, so the hook could not otherwise
  # tell our own synthetic keystrokes from a foreign tool's).
  "Win32_UI_Input_KeyboardAndMouse",
  # UI Automation: the only way to tell a password field from a normal one inside
  # Chromium, Electron and Java, which render their own text boxes and are
  # invisible to the Win32 ES_PASSWORD style.
  "Win32_UI_Accessibility",
  "Win32_System_Com",
] }

[[bin]]
name = "r3write"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
