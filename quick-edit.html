<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>R3write quick edit</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("r3write.theme.v1");
          var choice = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
          var resolved = choice === "system"
            ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : choice;
          document.documentElement.dataset.theme = resolved;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry-quick-edit.tsx"></script>
  </body>
</html>
